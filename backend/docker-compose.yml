version: "3.9"

services:
  api:
    container_name: loja_veloz_api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      NODE_ENV: development
    networks:
      - loja_veloz_net
    # Healthcheck — ensures API is healthy
    # Healthcheck — garante que a API está saudável
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  postgres:
    container_name: loja_veloz_db
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - loja_veloz_net
    # Healthcheck — ensures DB is accepting connections
    # Healthcheck — garante que o banco está aceitando conexões
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

# Persistent volume for the database
# Volume persistente para o banco
volumes:
  postgres_data:

# Internal network between API and DB
# Rede interna entre API e DB
networks:
  loja_veloz_net:
    driver: bridge
