name: CI/CD - Loja Veloz

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # Faz checkout do repositório
        # Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        # Configura Node.js
        # Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # Instala dependências do backend
        # Install backend dependencies
        run: cd backend && npm install

      - name: Run lint
        # Verifica qualidade do código com ESLint
        # Run ESLint to check code quality
        working-directory: backend
        run: npm run lint

      - name: Run tests
        # Executa testes automatizados
        # Run automated tests
        working-directory: backend
        run: npm test
        env:
          NODE_ENV: test

      - name: Login to Docker Hub
        # Faz login no Docker Hub
        # Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        # Faz build e push da imagem Docker
        # Build and push Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/loja-veloz-api:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/loja-veloz-api:latest \
            ./backend

          docker push ${{ secrets.DOCKER_USERNAME }}/loja-veloz-api:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/loja-veloz-api:latest

  deploy:
    needs: build-test-publish
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH with rollback
        # Faz deploy via SSH com rollback automático
        # Deploy via SSH with automatic rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}        # Host da VM / VM host
          username: ${{ secrets.SSH_USER }}    # Usuário SSH / SSH user
          key: ${{ secrets.SSH_KEY }}          # Chave privada / Private key

          script: |
            echo "=== CI/CD Loja Veloz - Deploy iniciado ==="
            echo "=== CI/CD Loja Veloz - Deploy started ==="

            # Garante que a rede existe
            # Ensure Docker network exists
            docker network create loja_veloz_net || true

            # AUTO-CONNECT: garante que o Postgres está na rede
            # AUTO-CONNECT: ensure PostgreSQL is attached to the network
            docker network connect loja_veloz_net loja_veloz_dt || true

            # Pull da nova imagem
            # Pull new image
            docker pull ${{ secrets.DOCKER_USERNAME }}/loja-veloz-api:${{ github.sha }}

            # Salva imagem atual para rollback
            # Save current production image for rollback
            docker tag \
              ${{ secrets.DOCKER_USERNAME }}/loja-veloz-api:latest \
              ${{ secrets.DOCKER_USERNAME }}/loja-veloz-api:previous || true

            # Remove API atual
            # Remove current API container
            docker rm -f loja-veloz-api || true

            # Sobe nova versão
            # Start new version
            docker run -d --name loja-veloz-api \
              --env-file /home/ubuntu/.env \
              --network loja_veloz_net \
              -p 3000:3000 \
              ${{ secrets.DOCKER_USERNAME }}/loja-veloz-api:${{ github.sha }}

            echo "Aguardando API iniciar..."
            echo "Waiting for API to start..."

            # Healthcheck com retry
            # Healthcheck with retry
            SUCCESS=false
            for i in {1..10}; do
              if curl -f http://localhost:3000/health; then
                SUCCESS=true
                break
              fi
              sleep 3
            done

            if [ "$SUCCESS" = true ]; then
              echo "Deploy OK - Nova versão funcionando"
              echo "Deploy OK - New version is working"
              exit 0
            fi

            echo "Deploy FALHOU - Iniciando rollback..."
            echo "Deploy FAILED - Starting rollback..."

            # Remove versão quebrada
            # Remove broken version
            docker rm -f loja-veloz-api || true

            # Sobe versão anterior
            # Start previous version
            docker run -d --name loja-veloz-api \
              --env-file /home/ubuntu/.env \
              --network loja_veloz_net \
              -p 3000:3000 \
              ${{ secrets.DOCKER_USERNAME }}/loja-veloz-api:previous

            # Testa rollback
            # Test rollback
            if curl -f http://localhost:3000/health; then
              echo "Rollback OK - Versão anterior restaurada"
              echo "Rollback OK - Previous version restored"
            else
              echo "Rollback FALHOU - Intervenção manual necessária"
              echo "Rollback FAILED - Manual intervention required"
            fi

            exit 1
