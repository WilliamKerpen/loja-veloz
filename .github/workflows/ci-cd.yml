name: CI/CD - Loja Veloz

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: cd backend && npm install

      - name: Run tests
        working-directory: backend
        run: npm test
        env:
          NODE_ENV: test

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/loja-veloz-api:${{ github.sha }} ./backend

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/loja-veloz-api:${{ github.sha }}

  deploy:
    needs: build-test-publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

      - name: Update Deployment image
        run: |
          kubectl set image deployment/loja-veloz-api \
            loja-veloz-api=${{ secrets.DOCKER_USERNAME }}/loja-veloz-api:${{ github.sha }} \
            -n loja-veloz

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/loja-veloz-api -n loja-veloz
