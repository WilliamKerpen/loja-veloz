name: CI/CD - Loja Veloz

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: cd backend && npm install

      - name: Run tests
        working-directory: backend
        run: npm test
        env:
          NODE_ENV: test

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push multi-arch image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t ${{ secrets.DOCKER_USERNAME }}/loja-veloz-api:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/loja-veloz-api:latest \
            --push ./backend

  deploy:
    needs: build-test-publish
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/loja-veloz-api:${{ github.sha }}
            docker stop loja-veloz-api || true
            docker rm loja-veloz-api || true
            docker run -d --name loja-veloz-api -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/loja-veloz-api:${{ github.sha }}
